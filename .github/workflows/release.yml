name: Release

# Each target builds natively on a runner of its own OS and CPU architecture
# (no cross-compiling), then one job publishes the GitHub release.
#
# Optional publishing jobs are off until you turn them on with repository
# variables (Settings → Secrets and variables → Actions → Variables):
#   HOMEBREW_TAP_ENABLED=true  + secret HOMEBREW_TAP_TOKEN
#   CRATES_IO_ENABLED=true     + secret CARGO_REGISTRY_TOKEN
#   WINGET_ENABLED=true        + secret WINGET_TOKEN (first version must be submitted by hand)
#
# Dry run: Actions → Release → Run workflow with "dry_run" ticked. It runs the
# checks and every native build, renders the package manifests, and uploads
# everything as workflow artifacts. Nothing is released or published.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]   # not the floating v1 Action tag
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.1.0). For a dry run it only names the archives."
        required: true
        default: v0.0.0-dry-run
        type: string
      dry_run:
        description: "Dry run: build and package only, publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  # ---- Linux -------------------------------------------------------------
  linux-x86_64-gnu:
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      target: x86_64-unknown-linux-gnu
      runner: ubuntu-24.04
      tag: ${{ github.event.inputs.tag || github.ref_name }}
      deb: true

  linux-aarch64-gnu:
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      target: aarch64-unknown-linux-gnu
      runner: ubuntu-24.04-arm
      tag: ${{ github.event.inputs.tag || github.ref_name }}
      deb: true

  linux-x86_64-musl:
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      target: x86_64-unknown-linux-musl
      runner: ubuntu-24.04
      tag: ${{ github.event.inputs.tag || github.ref_name }}
      musl: true

  linux-aarch64-musl:
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      target: aarch64-unknown-linux-musl
      runner: ubuntu-24.04-arm
      tag: ${{ github.event.inputs.tag || github.ref_name }}
      musl: true

  # ---- macOS -------------------------------------------------------------
  macos-x86_64:
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      target: x86_64-apple-darwin
      runner: macos-15-intel
      tag: ${{ github.event.inputs.tag || github.ref_name }}

  macos-aarch64:
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      target: aarch64-apple-darwin
      runner: macos-15
      tag: ${{ github.event.inputs.tag || github.ref_name }}

  # ---- Windows -----------------------------------------------------------
  windows-x86_64:
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      target: x86_64-pc-windows-msvc
      runner: windows-2025
      tag: ${{ github.event.inputs.tag || github.ref_name }}
      archive: zip

  windows-aarch64:
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      target: aarch64-pc-windows-msvc
      runner: windows-11-arm
      tag: ${{ github.event.inputs.tag || github.ref_name }}
      archive: zip

  # ---- Dry run -----------------------------------------------------------
  dry-run:
    name: Dry run summary (nothing published)
    if: inputs.dry_run
    needs:
      - linux-x86_64-gnu
      - linux-aarch64-gnu
      - linux-x86_64-musl
      - linux-aarch64-musl
      - macos-x86_64
      - macos-aarch64
      - windows-x86_64
      - windows-aarch64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Render package manifests
        run: packaging/render-manifests.sh "$RELEASE_TAG" dist manifests
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check --strict *.sha256
      - name: Summary
        run: |
          {
            echo "## Dry run for \`$RELEASE_TAG\`: nothing was published"
            echo
            echo "| File | Size |"
            echo "|---|---|"
            for f in dist/* manifests/*; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dry-run-manifests
          path: manifests/*

  # ---- Publish -----------------------------------------------------------
  release:
    name: GitHub release
    # Tag pushes have no inputs, so this runs for them; manual runs need dry_run off.
    if: ${{ !inputs.dry_run }}
    needs:
      - linux-x86_64-gnu
      - linux-aarch64-gnu
      - linux-x86_64-musl
      - linux-aarch64-musl
      - macos-x86_64
      - macos-aarch64
      - windows-x86_64
      - windows-aarch64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Render package manifests
        run: packaging/render-manifests.sh "$RELEASE_TAG" dist manifests
      - name: Combined checksums
        working-directory: dist
        run: cat *.sha256 > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            dist/*
            manifests/whambam.json
      - uses: actions/upload-artifact@v4
        with:
          name: manifests
          path: manifests/*

  homebrew:
    name: Update Homebrew tap
    needs: release
    if: vars.HOMEBREW_TAP_ENABLED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: manifests
          path: manifests
      - uses: actions/checkout@v4
        with:
          repository: cloudy-native/homebrew-whambam
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Commit formula
        run: |
          cp manifests/whambam.rb tap/Formula/whambam.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/whambam.rb
          git commit -m "whambam ${RELEASE_TAG#v}"
          git push

  crates-io:
    name: Publish to crates.io
    needs: release
    if: vars.CRATES_IO_ENABLED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  winget:
    name: Submit to winget
    needs: release
    if: vars.WINGET_ENABLED == 'true'
    runs-on: windows-2025
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: CloudyNative.Whambam
          release-tag: ${{ env.RELEASE_TAG }}
          installers-regex: '-pc-windows-msvc\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}

  action-test:
    name: Action self-test
    needs: release
    uses: ./.github/workflows/action-test.yml
    with:
      version: ${{ github.event.inputs.tag || github.ref_name }}
